<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Elite - Gateway Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen text-slate-100 p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-red-500 tracking-tight">🚑 Control Elite</h1>
            <p class="text-slate-400 text-sm mt-2">Emergency Routing & Response Platform</p>
        </div>

        <form id="authForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Select User Portal</label>
                <select id="userRole" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-red-500 cursor-pointer">
                    <option value="admin">Dispatcher / Admin Interface</option>
                    <option value="driver">Ambulance Driver View</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Personnel Email ID</label>
                <input type="email" required placeholder="name@emergency.gov.ng" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-red-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Security Password</label>
                <input type="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-red-500">
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-bold py-3 px-4 rounded-lg transition shadow-lg shadow-red-900/30 cursor-pointer mt-2">
                Access Operational Grid
            </button>
        </form>
    </div>

    <script>
        document.getElementById("authForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const role = document.getElementById("userRole").value;
            
            // Routes the user to their specific interface module
            if (role === "admin") {
                window.location.href = "admin.html";
            } else {
                window.location.href = "driver.html";
            }
        });
    </script>
</body>
</html>
