<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Elite - Mobile Driver View</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        #driverMap { height: 450px; width: 100%; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 p-4 font-sans">

    <div class="max-w-md mx-auto space-y-4">
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-xl">
            <div>
                <span class="text-xs font-bold text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-500/20 uppercase tracking-wider">Active Run</span>
                <h1 class="text-xl font-bold mt-1 text-slate-200">Unit Elite-01</h1>
            </div>
            <a href="index.html" class="text-xs bg-slate-950 border border-slate-800 text-slate-400 py-1.5 px-3 rounded-md">Exit</a>
        </header>

        <div class="bg-red-950/40 border border-red-500/30 p-4 rounded-xl">
            <h2 class="text-xs font-bold text-red-400 uppercase tracking-wider">Dispatcher Route Target</h2>
            <p id="targetAddressDisplay" class="text-lg font-bold text-slate-100 mt-1">Awaiting Orders...</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-2 rounded-xl shadow-2xl">
            <div id="driverMap"></div>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=API_Key_Here&callback=initDriverMap" async defer></script>

    <script>
        let map, navMarker, directionsRenderer, socket;

        function initDriverMap() {
            const currentVehiclePos = { lat: 6.5244, lng: 3.3792 };
            
            map = new google.maps.Map(document.getElementById("driverMap"), {
                zoom: 14,
                center: currentVehiclePos,
                disableDefaultUI: true, // Hides clutter to keep mobile navigation focus high
                styles: [{ featureType: "all", elementType: "geometry", stylers: [{ color: "#0f172a" }] }]
            });

            directionsRenderer = new google.maps.DirectionsRenderer({ 
                map: map,
                polylineOptions: { strokeColor: "#3b82f6", strokeWeight: 6 } // Blue line for driver focus
            });

            navMarker = new google.maps.Marker({
                position: currentVehiclePos,
                map: map,
                title: "My Ambulance Location"
            });

            connectDriverSocket();
        }

        function connectDriverSocket() {
            socket = new WebSocket("ws://127.0.0.1:8080");

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'DASHBOARD_UPDATE') {
                    const updatedCoords = { lat: data.lat, lng: data.lng };
                    
                    navMarker.setPosition(updatedCoords);
                    map.panTo(updatedCoords);

                    if (data.route && data.route.status === "OK") {
                        directionsRenderer.setDirections(data.route);
                        
                        // Grab the textual name of the end point location target
                        const routeLeg = data.route.routes[0].legs[0];
                        document.getElementById("targetAddressDisplay").innerText = routeLeg.end_address;
                    }
                }
            };
        }
    </script>
</body>
</html>
